name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: studio
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U studio -d studio" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://studio:ci-only-password@localhost:5432/studio?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install media decoder for real payload validation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go test -race ./... -count=1 -timeout=180s
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go build ./cmd/server
        working-directory: backend
      - run: go build ./cmd/monitor
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npx prettier --check ../docker-compose.yml ../deploy/compose.yaml ../.github/workflows/ci.yml ../deploy/smoke.mjs
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify browser notices are included unchanged in the production output
        run: cmp public/third-party-notices.txt dist/third-party-notices.txt
        working-directory: web
  container:
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production Compose configuration
        env:
          PUBLIC_URL: https://setup-smoke.invalid
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          APP_SECRET: ci-configuration-only-not-a-deployed-production-key
        run: |
          docker compose --env-file deploy/.env.production.example -f docker-compose.yml config --quiet
          docker compose --env-file deploy/.env.production.example -f deploy/compose.yaml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image for smoke and publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: frame-studio:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=studio-linux-amd64
          cache-to: type=gha,mode=max,scope=studio-linux-amd64
      - name: Prepare isolated smoke database image
        run: docker pull postgres:16.4-bookworm
      - name: Test production administrator setup without external services
        run: node deploy/smoke.mjs frame-studio:ci
      - name: Resolve lowercase image repository
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed smoke
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag frame-studio:ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          immutable_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          {
            echo '## Published image'
            echo "- Commit: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo "- Immutable reference: \`$immutable_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"
          current_head=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$current_head"
          if [ "$current_head" = "$GITHUB_SHA" ]; then
            docker tag frame-studio:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
            echo "- Latest: \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Latest was not changed because master has a newer commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
